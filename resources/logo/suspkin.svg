<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- SuspensionKinematics: a double wishbone corner seen from the front.
       Chassis pivots on the left, the upright inside the wheel on the right,
       and the spring between the lower arm and the chassis. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4466"/>
      <stop offset="1" stop-color="#0C1F33"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>

  <!-- the ground the tyre stands on -->
  <line x1="112" y1="210" x2="230" y2="210" stroke="#5F7C98" stroke-width="7" stroke-linecap="round"/>

  <!-- the wheel: tyre, rim -->
  <circle cx="172" cy="130" r="58" fill="none" stroke="#E9EEF3" stroke-width="22"/>
  <circle cx="172" cy="130" r="30" fill="none" stroke="#7F9AB4" stroke-width="6"/>

  <!-- the spring, lower arm to chassis -->
  <polyline points="108,166 104.7,152.4 114.6,138.5 86.7,133.8 109.3,116.8 81.4,112.1 104,95 76,90.4 98.6,73.3 83.3,65.6 80,52"
            fill="none" stroke="#F39A2C" stroke-width="8" stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- the two wishbones, the upright joining them and the stub axle -->
  <g stroke="#E9EEF3" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="48" y1="100" x2="146" y2="94"/>
    <line x1="42" y1="170" x2="146" y2="166"/>
    <line x1="146" y1="94" x2="146" y2="166"/>
    <line x1="146" y1="130" x2="172" y2="130"/>
  </g>
  <circle cx="172" cy="130" r="11" fill="#F39A2C"/>

  <!-- chassis pivots -->
  <g fill="#F39A2C">
    <circle cx="48" cy="100" r="12"/>
    <circle cx="42" cy="170" r="12"/>
    <circle cx="80" cy="52" r="9"/>
  </g>
</svg>
